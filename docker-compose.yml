services:
  mysql:
    image: mysql:8.4
    container_name: ticket-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: ticketdb
      MYSQL_USER: ticketuser
      MYSQL_PASSWORD: ticketpass
    volumes:
      - ticket-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: ticket-redis
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: ticket-backend
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ticketdb
      DB_USER: ticketuser
      DB_PASSWORD: ticketpass
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BUY_MODE: ${BUY_MODE:-ATOMIC}
      DEMO_DELAY_MS: ${DEMO_DELAY_MS:-300}
    ports:
      - "18080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # 只有測 synchronized / distributed lock 的多 JVM 情境才啟動。
  backend2:
    profiles: ["multi"]
    build:
      context: ./backend
    container_name: ticket-backend-2
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ticketdb
      DB_USER: ticketuser
      DB_PASSWORD: ticketpass
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BUY_MODE: ${BUY_MODE:-ATOMIC}
      DEMO_DELAY_MS: ${DEMO_DELAY_MS:-300}
    ports:
      - "18082:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: ticket-frontend
    ports:
      - "18081:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ticket-mysql-data:
