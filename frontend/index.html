<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f8f8f8">
  <title>ticket.｜活動與票券123</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/developer.css">
  <script src="/app.js" type="module"></script>
  <script src="/developer.js" type="module"></script>
</head>
<body>
  <a class="skip-link" href="#events">跳至活動列表</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/" aria-label="ticket. 首頁">
        <span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 5h16v5a2 2 0 0 0 0 4v5H4v-5a2 2 0 0 0 0-4V5Z"/><path d="M15 5v3m0 3v2m0 3v3"/></svg></span>
        <span>ticket<span class="brand-dot">.</span></span>
      </a>
      <nav class="header-nav" aria-label="主選單"><a href="#events" class="active">探索活動</a></nav>
      <div class="account">
        <button id="developerButton" class="developer-button" aria-haspopup="dialog"><span aria-hidden="true">&lt;/&gt;</span> 開發者</button>
        <span class="account-label">我的票券</span>
        <button id="accountButton" class="avatar-button" aria-label="開啟我的訂單" aria-haspopup="dialog" aria-expanded="false" aria-controls="orderPanel">
          <span id="avatarInitial" aria-hidden="true">U</span>
          <span id="orderDot" class="notification-dot" hidden></span>
        </button>
        <section id="orderPanel" class="order-panel" role="dialog" aria-labelledby="ordersTitle" hidden>
          <div class="panel-heading">
            <h2 id="ordersTitle">我的訂單 <span id="orderCount" class="count-badge">0</span></h2>
            <button id="closeOrders" class="icon-button" aria-label="關閉我的訂單">×</button>
          </div>
          <form id="userForm" class="user-form">
            <label for="userId">使用者 ID</label>
            <div class="user-input-row"><input id="userId" name="userId" value="user001" maxlength="100" required autocomplete="off" spellcheck="false"><button type="submit" class="small-button">切換</button></div>
          </form>
          <div class="orders-toolbar"><span id="ordersHint">訂單依成立時間排列</span><button id="refreshOrders" class="text-button">重新整理</button></div>
          <div id="ordersList" class="orders-list" aria-live="polite"><p class="panel-empty">正在讀取你的訂單…</p></div>
          <p class="panel-footnote">每場活動限購一張。</p>
        </section>
      </div>
    </div>
  </header>
  <main class="page">
    <section class="intro" aria-labelledby="pageTitle">
      <p class="eyebrow">EVENTS &amp; TICKETS</p>
      <h1 id="pageTitle">活動與票券</h1>
      <p class="intro-description">瀏覽活動、查看剩餘票數。搶票後，可在右上角查詢訂單。</p>
    </section>
    <section id="events" aria-labelledby="eventsTitle">
      <div class="section-toolbar">
        <div class="section-heading"><h2 id="eventsTitle">所有活動</h2><span id="eventCount" class="muted">讀取中</span></div>
        <div class="toolbar-actions">
          <div class="filters" role="group" aria-label="活動類別">
            <button class="filter active" data-category="all" aria-pressed="true">全部</button>
            <button class="filter" data-category="music" aria-pressed="false">音樂現場</button>
            <button class="filter" data-category="talk" aria-pressed="false">講座工作坊</button>
            <button class="filter" data-category="culture" aria-pressed="false">藝文生活</button>
          </div>
          <button id="refreshEvents" class="refresh-button" aria-label="重新整理活動"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 8a8 8 0 1 0 0 8M20 3v5h-5"/></svg></button>
        </div>
      </div>
      <p id="eventError" class="inline-error" role="alert" hidden></p>
      <div id="eventGrid" class="event-grid" aria-live="polite" aria-busy="true"><p class="grid-message">正在載入活動…</p></div>
    </section>
    <footer class="site-footer"><span>ticket.</span></footer>
  </main>
  <dialog id="developerDialog" class="developer-dialog" aria-labelledby="developerTitle">
    <header class="developer-heading"><div><p class="developer-eyebrow">DEVELOPER TOOLS</p><h2 id="developerTitle">開發者工具</h2></div><button id="closeDeveloper" class="developer-close" aria-label="關閉開發者工具">×</button></header>
    <div class="developer-layout">
      <nav class="developer-menu" aria-label="開發者操作">
        <button data-operation="state" class="selected" aria-pressed="true">庫存與訂單<span>查看目前資料</span></button>
        <button data-operation="load" aria-pressed="false">多人搶票<span>觀察非同步下單</span></button>
        <button data-operation="duplicate" aria-pressed="false">重複購買<span>同一用戶連續送出</span></button>
        <button data-operation="reset" aria-pressed="false">重設活動<span>清除單一活動訂單</span></button>
      </nav>
      <section class="developer-content">
        <p id="developerAvailability" class="developer-notice" role="status" hidden></p>
        <div class="developer-fields">
          <label>選擇活動<select id="developerEvent"></select></label>
          <label id="developerStockField" hidden>重設後票數<input id="developerStock" type="number" value="20" min="1" max="1000"></label>
          <label id="developerRequestsField" hidden>請求數<input id="developerRequests" type="number" value="100" min="1" max="500"></label>
          <label id="developerConcurrencyField" hidden>同時送出<input id="developerConcurrency" type="number" value="5" min="1" max="10"></label>
        </div>
        <h3 id="developerOperationTitle">庫存與訂單</h3>
        <p id="developerDescription" class="developer-description"></p>
        <ol id="developerSteps" class="developer-steps"></ol>
        <div class="developer-code-heading"><span>參考指令 · Bash</span><button id="copyDeveloperCommand" class="small-button">複製指令</button></div>
        <pre class="developer-code"><code id="developerCommand"></code></pre>
        <label id="developerConsentField" class="developer-consent" hidden><input id="developerConsent" type="checkbox"><span id="developerConsentText"></span></label>
        <div class="developer-actions"><button id="previewDeveloper" class="small-button">更新預覽</button><button id="executeDeveloper" class="buy-button">確認執行</button><button id="stopDeveloper" class="small-button" hidden>停止送出</button></div>
        <p id="developerMessage" class="developer-message" role="status" aria-live="polite"></p>
        <section id="developerResults" class="developer-results" aria-label="執行結果" hidden><div id="developerMetrics" class="developer-metrics"></div><p id="developerResultNote"></p><button id="refreshDeveloperState" class="small-button">重新查看資料</button></section>
      </section>
    </div>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden><span id="toastIcon" class="toast-icon" aria-hidden="true"></span><span id="toastText"></span><button id="dismissToast" aria-label="關閉通知">×</button></div>
</body>
</html>
