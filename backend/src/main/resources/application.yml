server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:ticketdb}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Taipei
    username: ${DB_USER:ticketuser}
    password: ${DB_PASSWORD:ticketpass}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 2s

  sql:
    init:
      mode: always
      encoding: UTF-8

ticket:
  developer:
    enabled: ${DEVELOPER_TOOLS_ENABLED:false}
  buy-mode: ${BUY_MODE:ATOMIC}
  rocketmq:
    namesrv: ${ROCKETMQ_NAMESRV:rocketmq-namesrv:9876}
    topic: ${ROCKETMQ_TOPIC:ticket-order-topic}
    producer-group: ${ROCKETMQ_PRODUCER_GROUP:ticket-order-producer-group}

demo:
  delay-ms: ${DEMO_DELAY_MS:300}
